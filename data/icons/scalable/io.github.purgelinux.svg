<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>

  <!-- disk platter, partly swept away -->
  <circle cx="64" cy="62" r="30" fill="url(#disk)"/>
  <circle cx="64" cy="62" r="9" fill="#1a5fb4"/>
  <path d="M64 32 a30 30 0 0 1 26 15 l-26 15 z" fill="#99c1f1" opacity="0.85"/>

  <!-- freed space: three chips lifting away -->
  <g fill="#f6f5f4" opacity="0.95">
    <rect x="88" y="26" width="14" height="14" rx="3" transform="rotate(18 95 33)"/>
    <rect x="102" y="44" width="10" height="10" rx="2.5" transform="rotate(-12 107 49)" opacity="0.8"/>
    <rect x="94" y="60" width="7" height="7" rx="2" transform="rotate(26 97 63)" opacity="0.6"/>
  </g>

  <!-- checkmark: safe by default -->
  <g transform="translate(60 76)">
    <circle cx="14" cy="14" r="17" fill="#2ec27e"/>
    <path d="M6.5 14.5 l5 5 l10.5 -11" fill="none" stroke="#ffffff" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
